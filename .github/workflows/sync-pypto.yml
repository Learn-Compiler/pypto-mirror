name: Sync pypto from GitCode

# 定时把 https://gitcode.com/cann/pypto.git 完整镜像到目标仓库。
# 只镜像 refs/heads/* 和 refs/tags/*，忽略 GitCode 广播的 refs/tmp/* 临时 ref。
# 文档见同仓库 README.md

on:
  schedule:
    # GitHub 用 UTC。每 2 小时的第 17 分钟跑一次，避开整点高峰。
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略 ref 差异检查，强制重新全量同步"
        type: boolean
        default: false

concurrency:
  group: sync-pypto
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_URL: https://gitcode.com/cann/pypto.git
  MIRROR_REPO: Learn-Compiler/pypto

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 配置 git（大仓库 + 慢链路容错）
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 100
          git config --global http.lowSpeedTime 300
          git config --global http.version HTTP/1.1

      - name: 比对上游与镜像的 ref，判断是否需要同步
        id: diff
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PAT }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)

          # --heads --tags 只取分支和标签，天然排除 GitCode 的 refs/tmp/*；
          # --refs 去掉 annotated tag 重复的 ^{} 行
          upstream_refs=$(git ls-remote --refs --heads --tags "$UPSTREAM_URL" | sort)
          mirror_refs=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote --refs --heads --tags "https://github.com/${MIRROR_REPO}.git" 2>/dev/null | sort || true)

          up_count=$(printf '%s\n' "$upstream_refs" | grep -c . || true)
          mk_count=$(printf '%s\n' "$mirror_refs"   | grep -c . || true)
          echo "上游 ref 数: ${up_count}，镜像 ref 数: ${mk_count}"

          if [ "${{ inputs.force }}" != "true" ] && [ "$upstream_refs" = "$mirror_refs" ]; then
            echo "✅ ref 完全一致，无需同步，跳过 58MB 克隆。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 检测到差异，开始全量同步。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 从 GitCode 抓取（只取分支和 tag）
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # 不用 clone --mirror：那会把 8000+ 个 refs/tmp/* 一起抓下来（多 364MB），
          # 而且推回 GitHub 时 GitHub 只接受 heads/tags，会整个 push 被拒。
          git init --bare -q upstream.git
          cd upstream.git
          git remote add origin "$UPSTREAM_URL"
          git config remote.origin.fetch '+refs/heads/*:refs/heads/*'
          git config --add remote.origin.fetch '+refs/tags/*:refs/tags/*'
          git fetch --prune --no-tags origin

          echo "--- 体积 ---"
          du -sh .
          echo "--- ref 统计 ---"
          git for-each-ref --format='%(refname)' | sed 's#refs/##' | awk -F/ '{print $1}' | sort | uniq -c

          # 防御：确认真没有混入非法 ref
          stray=$(git for-each-ref --format='%(refname)' | grep -vc -E '^refs/(heads|tags)/' || true)
          if [ "$stray" -ne 0 ]; then
            echo "::error::发现 $stray 个非 heads/tags 的 ref，中止。"
            git for-each-ref --format='%(refname)' | grep -v -E '^refs/(heads|tags)/' | head
            exit 1
          fi

      - name: 推送到 GitHub（先推 ref → 再切默认分支 → 最后清理残留）
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PAT }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          gitc() { git -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"; }

          cd upstream.git
          git remote remove mirror 2>/dev/null || true
          git remote add mirror "https://github.com/${MIRROR_REPO}.git"

          # 1) 先推所有分支和 tag。这里不能用 --prune / --mirror：
          #    如果目标仓库是带着 README 建的，默认分支是 main，
          #    GitHub 会拒绝删除当前默认分支，整个 push 直接失败。
          gitc push --quiet --force mirror \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          echo "✅ 分支和 tag 已推送"

          # 2) 这时 master 一定存在，把默认分支切过去
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${MIRROR_REPO}" \
            -d '{"default_branch":"master"}')
          if [ "$code" = "200" ]; then
            echo "✅ 默认分支 = master"
          else
            echo "::warning::设置默认分支失败 HTTP ${code}（PAT 缺 Administration 写权限？）"
            cat /tmp/resp.json || true
          fi

          # 3) 默认分支已经切走，这时才能删掉上游不存在的 ref（如建仓时留下的 main）
          gitc ls-remote --refs --heads --tags mirror | awk '{print $2}' > /tmp/remote_refs.txt
          git for-each-ref --format='%(refname)' > /tmp/local_refs.txt
          removed=0
          while read -r ref; do
            [ -z "$ref" ] && continue
            [ "$ref" = "refs/heads/master" ] && continue
            if ! grep -qxF "$ref" /tmp/local_refs.txt; then
              if gitc push --quiet mirror ":${ref}"; then
                echo "🗑  删除上游已不存在的 ref: ${ref}"
                removed=$((removed + 1))
              fi
            fi
          done < /tmp/remote_refs.txt
          echo "共清理 ${removed} 个残留 ref"

      - name: 同步摘要
        if: always()
        run: |
          {
            echo "### pypto 同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 | \`https://gitcode.com/cann/pypto.git\` |"
            echo "| 镜像 | \`https://github.com/${MIRROR_REPO}\` |"
            echo "| 是否触发同步 | \`${{ steps.diff.outputs.changed }}\` |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
